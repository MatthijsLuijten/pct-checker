name: PCT Permit Checker

on:
  schedule:
    - cron: '*/15 17-23 * * *'  # 09:00–15:45 UTC-8
    - cron: '*/15 0 * * *'      # 16:00–16:45 UTC-8
    - cron: '0 1 * * *'         # exactly 17:00 UTC-8
  workflow_dispatch:

jobs:
  check-permits:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install seleniumbase
    
    - name: Run permit checker
      env:
        HEADLESS: '1'
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
      run: python check_pct_availability.py
